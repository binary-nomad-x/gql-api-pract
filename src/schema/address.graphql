type Address {
  id: ID!
  user: User!
  label: String!
  street: String!
  city: String!
  state: String
  zip: String!
  country: String!
  isDefault: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateAddressInput {
  label: String
  street: String!
  city: String!
  state: String
  zip: String!
  country: String
  isDefault: Boolean
}

input UpdateAddressInput {
  label: String
  street: String
  city: String
  state: String
  zip: String
  country: String
  isDefault: Boolean
}

fragment AddressBasic on Address {
  id
  label
  street
  city
  state
  zip
  country
  isDefault
}

extend type Query {
  myAddresses: [Address!]! @auth
  address(id: ID!): Address @auth
}

extend type Mutation {
  createAddress(input: CreateAddressInput!): Address! @auth
  updateAddress(id: ID!, input: UpdateAddressInput!): Address! @auth
  deleteAddress(id: ID!): Boolean! @auth
  setDefaultAddress(id: ID!): Address! @auth
}
