}

enum NotificationType {
  SYSTEM
  ORDER_UPDATE
  PAYMENT_RECEIVED
  SHIPMENT_UPDATE
  NEW_FOLLOWER
  NEW_COMMENT
  NEW_LIKE
  REVIEW_REPLY
  PROMOTION
