type Conversation {
  id: ID!
  title: String
  participants: [ConversationParticipant!]!
  messages(limit: Int, offset: Int): [Message!]!
  lastMessage: Message
  messageCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConversationParticipant {
  id: ID!
  conversation: Conversation!
  user: User!
  lastReadAt: DateTime
  joinedAt: DateTime!
}

type Message {
  id: ID!
  conversation: Conversation!
  sender: User!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

extend type Query {
  myConversations: [Conversation!]! @auth
  conversation(id: ID!): Conversation @auth
  messages(conversationId: ID!, limit: Int, offset: Int): [Message!]! @auth
}

extend type Mutation {
  startConversation(userId: ID!, title: String): Conversation! @auth
  sendMessage(conversationId: ID!, content: String!): Message! @auth
  markConversationRead(conversationId: ID!): Boolean! @auth
}
