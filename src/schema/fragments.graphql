fragment UserBasic on User {
  id
  email
  name
  role
}

fragment UserFull on User {
  ...UserBasic
  profile { ...ProfileBasic }
  posts { id title published }
  createdAt
  updatedAt
}

fragment ProfileBasic on Profile {
  id
  bio
  avatar
  phone
}

fragment PostBasic on Post {
  id
  title
  published
  likeCount
  commentCount
  createdAt
}

fragment PostFull on Post {
  ...PostBasic
  content
  author { ...UserBasic }
  tags { id name }
  categories { id name slug }
  viewCount
  saveCount
  updatedAt
}

fragment ProductBasic on Product {
  id
  name
  price
  stock
  sku
  imageUrl
  isActive
  reviewCount
  averageRating
}

fragment ProductFull on Product {
  ...ProductBasic
  description
  seller { ...UserBasic }
  category { id name slug }
  images { id url alt sortOrder }
  createdAt
  updatedAt
}

fragment OrderBasic on Order {
  id
  status
  totalAmount
  discountAmount
  itemCount
  createdAt
}

fragment OrderFull on Order {
  ...OrderBasic
  user { ...UserBasic }
  items { id quantity unitPrice product { ...ProductBasic } }
  payment { id amount method status }
  shipments { id carrier trackingNumber status }
  coupon { id code discountPercent }
  shippingAddress
  updatedAt
}

fragment AddressBasic on Address {
  id
  label
  street
  city
  state
  zip
  country
  isDefault
}

fragment NotificationBasic on Notification {
  id
  type
  title
  message
  link
  isRead
  createdAt
}

fragment CartFull on Cart {
  id
  itemCount
  totalAmount
  items { id quantity product { ...ProductBasic } }
}
