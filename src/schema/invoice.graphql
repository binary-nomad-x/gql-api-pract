type Invoice {
  id: ID!
  order: Order!
  invoiceNumber: String!
  amount: Float!
  status: InvoiceStatus!
  issuedAt: DateTime!
  paidAt: DateTime
  dueDate: DateTime!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateInvoiceInput {
  orderId: ID!
  dueDate: DateTime!
}

extend type Query {
  myInvoices(status: InvoiceStatus, limit: Int, offset: Int): [Invoice!]! @auth
  invoice(id: ID!): Invoice @auth
}

extend type Mutation {
  createInvoice(input: CreateInvoiceInput!): Invoice! @auth
  markInvoicePaid(id: ID!): Invoice! @auth
  cancelInvoice(id: ID!): Invoice! @auth
}
