type Notification {
  id: ID!
  user: User!
  type: NotificationType!
  title: String!
  message: String
  link: String
  isRead: Boolean!
  readAt: DateTime
  createdAt: DateTime!
}

fragment NotificationBasic on Notification {
  id
  type
  title
  message
  link
  isRead
  createdAt
}

extend type Query {
  myNotifications(limit: Int, offset: Int): [Notification!]! @auth
  unreadNotificationCount: Int! @auth
}

extend type Mutation {
  markNotificationRead(id: ID!): Notification! @auth
  markAllNotificationsRead: Boolean! @auth
}
