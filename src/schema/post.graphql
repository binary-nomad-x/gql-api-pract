type Post {
  id: ID!
  title: String!
  content: String
  published: Boolean!
  author: User!
  tags: [Tag!]!
  categories: [Category!]!
  comments: [Comment!]!
  likes: [Like!]!
  savedBy: [SavedPost!]!
  views: [PostView!]!
  likeCount: Int!
  commentCount: Int!
  viewCount: Int!
  saveCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Tag {
  id: ID!
  name: String!
  posts: [Post!]!
  postCount: Int!
  createdAt: DateTime!
}

type Category {
  id: ID!
  name: String!
  slug: String!
  description: String
  posts: [Post!]!
  products: [Product!]!
  postCount: Int!
  productCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Comment {
  id: ID!
  content: String!
  author: User!
  post: Post!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Like {
  id: ID!
  user: User!
  post: Post!
  createdAt: DateTime!
}

type SavedPost {
  id: ID!
  user: User!
  post: Post!
  createdAt: DateTime!
}

type PostView {
  id: ID!
  post: Post!
  user: User
  ip: String
  viewedAt: DateTime!
}

input CreatePostInput {
  title: String!
  content: String
  published: Boolean
  tags: [String!]
  categories: [String!]
}

input UpdatePostInput {
  title: String
  content: String
  published: Boolean
}

input CreateCommentInput {
  content: String!
  postId: ID!
}

input CreateCategoryInput {
  name: String!
  slug: String!
  description: String
}

fragment PostBasic on Post {
  id
  title
  published
  likeCount
  commentCount
  createdAt
}

fragment PostFull on Post {
  ...PostBasic
  content
  author {
    ...UserBasic
  }
  tags {
    id
    name
  }
  categories {
    id
    name
    slug
  }
  viewCount
  saveCount
  updatedAt
}

extend type Query {
  posts(published: Boolean, search: String, limit: Int, offset: Int): [Post!]!
  post(id: ID!): Post
  tags: [Tag!]!
  tag(id: ID!): Tag
  tagByName(name: String!): Tag
  categories: [Category!]!
  category(id: ID!): Category
  categoryBySlug(slug: String!): Category
  comments(postId: ID!): [Comment!]!
  comment(id: ID!): Comment
  likes(postId: ID!): [Like!]!
  mySavedPosts(limit: Int, offset: Int): [SavedPost!]! @auth
  getPostsByAuthorId(authorId: ID!): [Post!]! @auth
}

extend type Mutation {
  createPost(input: CreatePostInput!): Post! @auth
  updatePost(id: ID!, input: UpdatePostInput!): Post! @auth
  deletePost(id: ID!): Boolean! @auth
  publishPost(id: ID!): Post! @auth
  unpublishPost(id: ID!): Post! @auth
  createTag(name: String!): Tag! @auth
  createCategory(input: CreateCategoryInput!): Category! @auth
  createComment(input: CreateCommentInput!): Comment! @auth
  deleteComment(id: ID!): Boolean! @auth
  toggleLike(postId: ID!): Like!
  toggleSavePost(postId: ID!): SavedPost! @auth
  recordPostView(postId: ID!): PostView!
}
