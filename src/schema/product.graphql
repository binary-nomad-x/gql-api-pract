type Product {
  id: ID!
  name: String!
  description: String
  price: Float!
  stock: Int!
  sku: String!
  imageUrl: String
  images: [ProductImage!]!
  isActive: Boolean!
  seller: User!
  category: Category
  orderItems: [OrderItem!]!
  reviews: [Review!]!
  wishlistItems: [WishlistItem!]!
  reviewCount: Int!
  averageRating: Float
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductImage {
  id: ID!
  product: Product!
  url: String!
  alt: String
  sortOrder: Int!
  createdAt: DateTime!
}

type Review {
  id: ID!
  rating: Int!
  title: String
  content: String
  product: Product!
  user: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateProductInput {
  name: String!
  description: String
  price: Float!
  stock: Int!
  sku: String!
  imageUrl: String
  categorySlug: String
}

input UpdateProductInput {
  name: String
  description: String
  price: Float
  stock: Int
  imageUrl: String
  isActive: Boolean
  categorySlug: String
}

input CreateReviewInput {
  rating: Int!
  title: String
  content: String
  productId: ID!
}

fragment ProductBasic on Product {
  id
  name
  price
  stock
  sku
  imageUrl
  isActive
  reviewCount
  averageRating
}

fragment ProductFull on Product {
  ...ProductBasic
  description
  seller {
    ...UserBasic
  }
  category {
    id
    name
    slug
  }
  images {
    id
    url
    alt
    sortOrder
  }
  createdAt
  updatedAt
}

extend type Query {
  products(categorySlug: String, search: String, minPrice: Float, maxPrice: Float, limit: Int, offset: Int): [Product!]!
  product(id: ID!): Product
  productBySku(sku: String!): Product
  reviews(productId: ID!, limit: Int, offset: Int): [Review!]!
  review(id: ID!): Review
}

extend type Mutation {
  createProduct(input: CreateProductInput!): Product! @auth
  updateProduct(id: ID!, input: UpdateProductInput!): Product! @auth
  deleteProduct(id: ID!): Boolean! @auth
  createReview(input: CreateReviewInput!): Review! @auth
  deleteReview(id: ID!): Boolean! @auth
}
