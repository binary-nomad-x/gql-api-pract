type Coupon {
  id: ID!
  code: String!
  description: String
  discountPercent: Float!
  discountAmount: Float!
  minPurchase: Float!
  maxUses: Int!
  usedCount: Int!
  isActive: Boolean!
  orders: [Order!]!
  expiresAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Discount {
  id: ID!
  product: Product!
  name: String!
  type: DiscountType!
  value: Float!
  startDate: DateTime!
  endDate: DateTime!
  isActive: Boolean!
  maxUsage: Int!
  usedCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateCouponInput {
  code: String!
  description: String
  discountPercent: Float
  discountAmount: Float
  minPurchase: Float
  maxUses: Int
  isActive: Boolean
  expiresAt: DateTime
}

input CreateDiscountInput {
  productId: ID!
  name: String!
  type: DiscountType!
  value: Float!
  startDate: DateTime!
  endDate: DateTime!
  maxUsage: Int
}

input UpdateDiscountInput {
  name: String
  value: Float
  startDate: DateTime
  endDate: DateTime
  isActive: Boolean
  maxUsage: Int
}

extend type Query {
  couponByCode(code: String!): Coupon
  activeDiscounts: [Discount!]!
  productDiscounts(productId: ID!): [Discount!]!
}

extend type Mutation {
  createCoupon(input: CreateCouponInput!): Coupon! @auth
  createDiscount(input: CreateDiscountInput!): Discount! @auth
  updateDiscount(id: ID!, input: UpdateDiscountInput!): Discount! @auth
  deleteDiscount(id: ID!): Boolean! @auth
}
