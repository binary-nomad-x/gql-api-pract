# ==================== Directives ====================
directive @auth on FIELD_DEFINITION

# ==================== Scalars ====================
scalar DateTime

# ==================== Enums ====================
enum Role {
    USER
    ADMIN
    MODERATOR
}

enum OrderStatus {
    PENDING
    CONFIRMED
    PROCESSING
    SHIPPED
    DELIVERED
    CANCELLED
}

enum PaymentMethod {
    CREDIT_CARD
    DEBIT_CARD
    PAYPAL
    BANK_TRANSFER
    CASH_ON_DELIVERY
}

enum PaymentStatus {
    PENDING
    COMPLETED
    FAILED
    REFUNDED
}

enum RefundStatus {
    PENDING
    APPROVED
    REJECTED
    COMPLETED
}

# ==================== Types ====================
type User {
    id: ID!
    email: String!
    name: String
    role: Role!
    profile: Profile
    posts: [Post!]!
    comments: [Comment!]!
    likes: [Like!]!
    products: [Product!]!
    orders: [Order!]!
    reviews: [Review!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Profile {
    id: ID!
    bio: String
    avatar: String
    phone: String
    address: String
    user: User!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Post {
    id: ID!
    title: String!
    content: String
    published: Boolean!
    author: User!
    tags: [Tag!]!
    categories: [Category!]!
    comments: [Comment!]!
    likes: [Like!]!
    likeCount: Int!
    commentCount: Int!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Tag {
    id: ID!
    name: String!
    posts: [Post!]!
    createdAt: DateTime!
}

type Category {
    id: ID!
    name: String!
    slug: String!
    description: String
    posts: [Post!]!
    products: [Product!]!
    postCount: Int!
    productCount: Int!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Comment {
    id: ID!
    content: String!
    author: User!
    post: Post!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Like {
    id: ID!
    user: User!
    post: Post!
    createdAt: DateTime!
}

type Product {
    id: ID!
    name: String!
    description: String
    price: Float!
    stock: Int!
    sku: String!
    imageUrl: String
    isActive: Boolean!
    seller: User!
    category: Category
    orderItems: [OrderItem!]!
    reviews: [Review!]!
    reviewCount: Int!
    averageRating: Float
    createdAt: DateTime!
    updatedAt: DateTime!
}

type OrderItem {
    id: ID!
    order: Order!
    product: Product!
    quantity: Int!
    unitPrice: Float!
    createdAt: DateTime!
}

type Order {
    id: ID!
    user: User!
    status: OrderStatus!
    totalAmount: Float!
    shippingAddress: String
    items: [OrderItem!]!
    payment: Payment
    refunds: [Refund!]!
    itemCount: Int!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Payment {
    id: ID!
    order: Order!
    amount: Float!
    method: PaymentMethod!
    status: PaymentStatus!
    transactionId: String!
    refunds: [Refund!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Refund {
    id: ID!
    payment: Payment!
    order: Order!
    amount: Float!
    reason: String
    status: RefundStatus!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Review {
    id: ID!
    rating: Int!
    title: String
    content: String
    product: Product!
    user: User!
    createdAt: DateTime!
    updatedAt: DateTime!
}

# ==================== Inputs ====================
input CreateUserInput {
    email: String!
    name: String
    password: String!
}

input UpdateUserInput {
    name: String
    email: String
    password: String
}

input CreatePostInput {
    title: String!
    content: String
    published: Boolean
    tags: [String!]
    categories: [String!]
}

input UpdatePostInput {
    title: String
    content: String
    published: Boolean
}

input CreateCommentInput {
    content: String!
    postId: ID!
}

input CreateCategoryInput {
    name: String!
    slug: String!
    description: String
}

input CreateProductInput {
    name: String!
    description: String
    price: Float!
    stock: Int!
    sku: String!
    imageUrl: String
    categorySlug: String
}

input UpdateProductInput {
    name: String
    description: String
    price: Float
    stock: Int
    imageUrl: String
    isActive: Boolean
    categorySlug: String
}

input CreateReviewInput {
    rating: Int!
    title: String
    content: String
    productId: ID!
}

input PlaceOrderInput {
    items: [OrderItemInput!]!
    shippingAddress: String
}

input OrderItemInput {
    productId: ID!
    quantity: Int!
}

input ProcessPaymentInput {
    orderId: ID!
    method: PaymentMethod!
}

input CreateRefundInput {
    paymentId: ID!
    orderId: ID!
    amount: Float!
    reason: String
}

# ==================== Queries ====================
type Query {
    # Users
    users: [User!]! @auth
    user(id: ID!): User @auth
    me: User @auth

    # Posts
    posts(
        published: Boolean
        search: String
        limit: Int = 10
        offset: Int = 0
    ): [Post!]!
    post(id: ID!): Post

    # Tags
    tags: [Tag!]!
    tag(id: ID!): Tag
    tagByName(name: String!): Tag

    # Categories
    categories: [Category!]!
    category(id: ID!): Category
    categoryBySlug(slug: String!): Category

    # Comments
    comments(postId: ID!): [Comment!]!
    comment(id: ID!): Comment

    # Likes
    likes(postId: ID!): [Like!]!

    # Products
    products(
        categorySlug: String
        search: String
        minPrice: Float
        maxPrice: Float
        limit: Int = 20
        offset: Int = 0
    ): [Product!]!
    product(id: ID!): Product
    productBySku(sku: String!): Product

    # Orders
    orders(
        status: OrderStatus
        limit: Int = 20
        offset: Int = 0
    ): [Order!]! @auth
    order(id: ID!): Order @auth

    # Payments
    payments(
        status: PaymentStatus
        limit: Int = 20
        offset: Int = 0
    ): [Payment!]! @auth
    payment(id: ID!): Payment @auth

    # Refunds
    refunds(
        status: RefundStatus
        limit: Int = 20
        offset: Int = 0
    ): [Refund!]! @auth
    refund(id: ID!): Refund @auth

    # Reviews
    reviews(
        productId: ID!
        limit: Int = 20
        offset: Int = 0
    ): [Review!]!
    review(id: ID!): Review

    # Stats
    stats: Stats!
}

type Stats {
    totalUsers: Int!
    totalPosts: Int!
    totalPublishedPosts: Int!
    totalTags: Int!
    totalCategories: Int!
    totalComments: Int!
    totalLikes: Int!
    totalProducts: Int!
    totalOrders: Int!
    totalPayments: Int!
    totalRefunds: Int!
    totalReviews: Int!
}

# ==================== Mutations ====================
type Mutation {
    # Auth
    signup(input: CreateUserInput!): AuthPayload!
    login(email: String!, password: String!): AuthPayload!

    # Users
    updateUser(id: ID!, input: UpdateUserInput!): User! @auth
    deleteUser(id: ID!): Boolean! @auth

    # Profile
    updateProfile(
        bio: String
        avatar: String
        phone: String
        address: String
    ): Profile! @auth

    # Posts
    createPost(input: CreatePostInput!): Post! @auth
    updatePost(id: ID!, input: UpdatePostInput!): Post! @auth
    deletePost(id: ID!): Boolean! @auth
    publishPost(id: ID!): Post! @auth
    unpublishPost(id: ID!): Post! @auth

    # Tags
    createTag(name: String!): Tag! @auth

    # Categories
    createCategory(input: CreateCategoryInput!): Category! @auth

    # Comments
    createComment(input: CreateCommentInput!): Comment! @auth
    deleteComment(id: ID!): Boolean! @auth

    # Likes
    toggleLike(postId: ID!): Like!

    # Products
    createProduct(input: CreateProductInput!): Product! @auth
    updateProduct(id: ID!, input: UpdateProductInput!): Product! @auth
    deleteProduct(id: ID!): Boolean! @auth

    # Orders
    placeOrder(input: PlaceOrderInput!): Order! @auth
    cancelOrder(id: ID!): Order! @auth
    updateOrderStatus(id: ID!, status: OrderStatus!): Order! @auth

    # Payments
    processPayment(input: ProcessPaymentInput!): Payment! @auth

    # Refunds
    createRefund(input: CreateRefundInput!): Refund! @auth
    updateRefundStatus(id: ID!, status: RefundStatus!): Refund! @auth

    # Reviews
    createReview(input: CreateReviewInput!): Review! @auth
    deleteReview(id: ID!): Boolean! @auth
}

type AuthPayload {
    token: String!
    user: User!
}
