# ==================== Directives ====================
directive @auth on FIELD_DEFINITION

# ==================== Scalars ====================
scalar DateTime

# ==================== Enums ====================
enum Role {
    USER
    ADMIN
    MODERATOR
}

# ==================== Types ====================
type User {
    id: ID!
    email: String!
    name: String
    role: Role!
    profile: Profile
    posts: [Post!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Profile {
    id: ID!
    bio: String
    avatar: String
    phone: String
    address: String
    user: User!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Post {
    id: ID!
    title: String!
    content: String
    published: Boolean!
    author: User!
    tags: [Tag!]!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type Tag {
    id: ID!
    name: String!
    posts: [Post!]!
    createdAt: DateTime!
}

# ==================== Inputs ====================
input CreateUserInput {
    email: String!
    name: String
    password: String!
}

input UpdateUserInput {
    name: String
    email: String
    password: String
}

input CreatePostInput {
    title: String!
    content: String
    published: Boolean
    tags: [String!]
}

input UpdatePostInput {
    title: String
    content: String
    published: Boolean
}

# ==================== Queries ====================
type Query {
    # Users
    users: [User!]! @auth
    user(id: ID!): User @auth
    me: User @auth

    # Posts
    posts(
        published: Boolean
        search: String
        limit: Int = 10
        offset: Int = 0
    ): [Post!]!
    post(id: ID!): Post

    # Tags
    tags: [Tag!]!
    tag(id: ID!): Tag
    tagByName(name: String!): Tag

    # Stats
    stats: Stats!
}

type Stats {
    totalUsers: Int!
    totalPosts: Int!
    totalPublishedPosts: Int!
    totalTags: Int!
}

# ==================== Mutations ====================
type Mutation {
    # Auth
    signup(input: CreateUserInput!): AuthPayload!
    login(email: String!, password: String!): AuthPayload!

    # Users
    updateUser(id: ID!, input: UpdateUserInput!): User! @auth
    deleteUser(id: ID!): Boolean! @auth

    # Profile
    updateProfile(
        bio: String
        avatar: String
        phone: String
        address: String
    ): Profile! @auth

    # Posts
    createPost(input: CreatePostInput!): Post! @auth
    updatePost(id: ID!, input: UpdatePostInput!): Post! @auth
    deletePost(id: ID!): Boolean! @auth
    publishPost(id: ID!): Post! @auth
    unpublishPost(id: ID!): Post! @auth

    # Tags
    createTag(name: String!): Tag! @auth
}

type AuthPayload {
    token: String!
    user: User!
}
