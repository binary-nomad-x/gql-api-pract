type SupportTicket {
  id: ID!
  user: User!
  subject: String!
  description: String!
  status: TicketStatus!
  priority: TicketPriority!
  category: String!
  assignedTo: String
  replies: [TicketReply!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TicketReply {
  id: ID!
  ticket: SupportTicket!
  user: User!
  content: String!
  isStaff: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTicketInput {
  subject: String!
  description: String!
  priority: TicketPriority
  category: String
}

input AddTicketReplyInput {
  ticketId: ID!
  content: String!
}

extend type Query {
  myTickets(status: TicketStatus, limit: Int, offset: Int): [SupportTicket!]! @auth
  ticket(id: ID!): SupportTicket @auth
  ticketReplies(ticketId: ID!): [TicketReply!]! @auth
}

extend type Mutation {
  createTicket(input: CreateTicketInput!): SupportTicket! @auth
  addTicketReply(input: AddTicketReplyInput!): TicketReply! @auth
  resolveTicket(id: ID!): SupportTicket! @auth
  closeTicket(id: ID!): SupportTicket! @auth
}
