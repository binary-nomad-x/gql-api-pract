fragment OrderBasic on Order {
  id
  status
  totalAmount
  discountAmount
  itemCount
  createdAt
}

fragment OrderFull on Order {
  ...OrderBasic
  user {
    ...UserBasic
  }
  items {
    id
    quantity
    unitPrice
    product {
      ...ProductBasic
    }
  }
  payment {
    id
    amount
    method
    status
  }
  shipments {
    id
    carrier
    trackingNumber
    status
  }
  coupon {
    id
    code
    discountPercent
  }
  shippingAddress
  updatedAt
}
