fragment ProductBasic on Product {
  id
  name
  price
  stock
  sku
  imageUrl
  isActive
  reviewCount
  averageRating
}

fragment ProductFull on Product {
  ...ProductBasic
  description
  seller {
    ...UserBasic
  }
  category {
    id
    name
    slug
  }
  images {
    id
    url
    alt
    sortOrder
  }
  createdAt
  updatedAt
}
